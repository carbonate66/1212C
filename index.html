<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLC 模型拆解展示</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }

        /* 设置 3D 视图的窗口大小 */
        model-viewer {
            width: 100%;
            height: 80vh;
            background-color: #eeeeee;
        }

        /* 按钮的样式 */
        .controls {
            margin-top: 30px;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <model-viewer 
        id="plc-model" 
        src="1212C.glb" 
        camera-controls 
        shadow-intensity="1" 
        alt="PLC 3D 模型">
    </model-viewer>

    <div class="controls">
        <button id="toggle-btn">一键拆解 / 复原</button>
    </div>

    <script>
        const modelViewer = document.querySelector('#plc-model');
        const btn = document.querySelector('#toggle-btn');
        let isExploded = false; // 记录当前是拆解状态还是复原状态

        btn.addEventListener('click', () => {
            if (!isExploded) {
                // 正向播放动画（拆解）
                modelViewer.timeScale = 1; 
                modelViewer.play();
                isExploded = true;
            } else {
                // 反向播放动画（复原）
                modelViewer.timeScale = -1; 
                modelViewer.play();
                isExploded = false;
            }
        });
    </script>

</body>
</html>
