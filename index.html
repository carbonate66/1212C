<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLC 模型展示 - 1212c</title>
    
    <!-- 引入 model-viewer 核心库 -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 顶部标题栏 */
        .header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }

        /* 模型容器，占满剩余空间 */
        #viewer-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* model-viewer 样式 */
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #e0e0e0;
            /* 可选：添加默认环境光反射，使金属/塑料材质更真实 */
            --poster-color: transparent;
        }

        /* 控制按钮区域 */
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.85);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            backdrop-filter: blur(5px);
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
            border: 1px solid #bdc3c7;
            background: white;
            color: #34495e;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #3498db;
            color: white;
            border-color: #3498db;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="header">
        PLC 型号: 1212C 3D 预览
    </div>

    <div id="viewer-container">
        <!-- 
            src: 指定你的模型文件路径
            camera-controls: 允许鼠标拖拽旋转、滚轮缩放
            shadow-intensity: 开启底部阴影并设置强度
            auto-rotate: 开启自动旋转 (如果不想要可以删掉这个属性)
        -->
        <model-viewer 
            id="plc-model" 
            src="1212c.glb" 
            camera-controls 
            shadow-intensity="1.5"
            camera-orbit="0deg 75deg 105%"
            min-camera-orbit="auto auto 5%"
            max-camera-orbit="auto auto 200%">
        </model-viewer>

        <!-- 视角控制面板 -->
        <div class="controls">
            <button onclick="setView('front')">前视</button>
            <button onclick="setView('back')">后视</button>
            <button onclick="setView('left')">左视</button>
            <button onclick="setView('right')">右视</button>
            <button onclick="setView('top')">俯视</button>
            <button onclick="setView('isometric')">等轴测 (默认)</button>
        </div>
    </div>

    <script>
        // 获取模型展示组件的 DOM 节点
        const modelViewer = document.querySelector('#plc-model');

        // 定义视角切换函数
        // camera-orbit 接受三个参数：水平角度(theta) 垂直角度(phi) 缩放距离(radius)
        function setView(view) {
            switch(view) {
                case 'front':
                    modelViewer.cameraOrbit = '0deg 90deg 105%';
                    break;
                case 'back':
                    modelViewer.cameraOrbit = '180deg 90deg 105%';
                    break;
                case 'left':
                    modelViewer.cameraOrbit = '-90deg 90deg 105%';
                    break;
                case 'right':
                    modelViewer.cameraOrbit = '90deg 90deg 105%';
                    break;
                case 'top':
                    // 垂直角度设为 0deg 即为正上方
                    modelViewer.cameraOrbit = '0deg 0deg 105%';
                    break;
                case 'isometric':
                    // 默认的 45 度斜视视角
                    modelViewer.cameraOrbit = '45deg 55deg 105%';
                    break;
            }
        }
    </script>
</body>
</html>
